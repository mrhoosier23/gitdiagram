name: Private GitDiagram offline preflight

# This workflow NEVER deploys, provisions resources or accesses Cloudflare.
# It runs only from the isolated preparation branch on GitHub-hosted runners.
on:
  push:
    branches:
      - private-cloudflare-isolation-prep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitdiagram-private-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No environment, deployment token, GitHub environment secret or
    # Cloudflare account ID is passed to this job.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify committed formatting (no repository writes)
        shell: bash
        run: |
          bun ci
          bun run format:write
          if ! git diff --quiet --; then
            echo "Formatting changes required. This is an isolated runner; the files below have NOT been committed."
            while IFS= read -r -d '' file; do
              echo "FORMATTED_FILE_BEGIN=$file"
              base64 -w0 "$file"
              echo
              echo "FORMATTED_FILE_END=$file"
            done < <(git diff --name-only -z --)
            exit 1
          fi
      - name: Local tests, private OpenNext build and Wrangler dry-runs ONLY
        run: bash scripts/private/offline-verify.sh
        env:
          # Compile against the actual owner-protected hostname, never call it.
          PRIVATE_SITE_ORIGIN: https://gitdiagram.awolverton.com
          REDIS_TEST_URL: redis://127.0.0.1:6379
